# Arena64 staging — one host, docker compose.
#
# Run from this directory:
#
#     docker compose --env-file staging.env up -d
#
# ## What this is, and what it is not
#
# It is the first environment on which this platform has ever run outside a
# developer's machine, and its job is to answer questions nothing else can:
# does the image boot on a clean host, do the migrations apply to an empty
# database, does a WebSocket survive a reverse proxy, do the email links
# point anywhere real.
#
# It is **not** production. `architecture.md` AD-03 gives each Redis role its
# own instance in a deployed tier and this runs one; AD-02 splits `api`,
# `gateway` and `worker` into separate processes and this runs the single
# process the code actually is (see `apps/api/Dockerfile`). Both are
# deliberate for a first environment and both are recorded in
# `docs/01-architecture/deployment.md`.
#
# ## Secrets
#
# Every secret is read from `staging.env`, which is **not** in this
# repository and must never be. `staging.env.example` lists the names and
# what each is for; the values are the operator's.

name: arena64-staging

services:
  # --- the application -----------------------------------------------------
  api:
    image: ghcr.io/shohruh-yuldashov/arena64-api:${ARENA64_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-provision: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: staging
      POSTGRES_DSN: postgresql+asyncpg://arena64:${POSTGRES_PASSWORD}@postgres:5432/arena64
      # One instance, five logical databases — the `local` shape, not AD-03's.
      # A staging tier that fell over because `cache` evicted a rate-limit
      # counter would be a fair warning, and it is cheaper to take that
      # warning here than to run five instances on one host pretending to be
      # five machines.
      REDIS_LIVE_URL: redis://redis:6379/0
      REDIS_BUS_URL: redis://redis:6379/1
      REDIS_BROKER_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
      REDIS_LIMITS_URL: redis://redis:6379/4
      # A64-027.1. `LocalStorageProvider` refuses to construct in a deployed
      # tier — objects would live on one node's disk and vanish on the next
      # reschedule — so staging runs the S3 provider against MinIO, which is
      # S3-compatible and speaks the same signature.
      STORAGE_PROVIDER: s3
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_BUCKET: arena64-media
      STORAGE_S3_REGION: auto
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_BASE_URL: https://${ARENA64_DOMAIN}/media
      PUBLIC_APP_URL: https://${ARENA64_DOMAIN}
      # The server-side half of the CSRF defence for the browser refresh
      # cookie. `Settings` refuses to start a deployed tier with an empty
      # list, because that leaves only the browser's SameSite guarantee —
      # and this stack failed to boot on exactly that guard the first time
      # it ran, which is what a staging environment is for.
      BROWSER_SESSION_TRUSTED_ORIGINS: '["https://${ARENA64_DOMAIN}"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMAIL_VERIFICATION_OTP_SECRET: ${EMAIL_VERIFICATION_OTP_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      EMAIL_FROM_NAME: Arena64
    expose:
      - "8000"

  # Runs once, before the application, and exits. A migration racing an
  # application that has already begun serving is how a request meets half a
  # schema; `depends_on: service_completed_successfully` is what orders them.
  migrate:
    image: ghcr.io/shohruh-yuldashov/arena64-api:${ARENA64_TAG:-latest}
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ENVIRONMENT: staging
      POSTGRES_DSN: postgresql+asyncpg://arena64:${POSTGRES_PASSWORD}@postgres:5432/arena64
      # `alembic upgrade` touches nothing but the database, and the guards
      # that demand the rest are enforced when `Settings` is built. These are
      # the smallest set that lets it construct.
      REDIS_LIVE_URL: redis://redis:6379/0
      REDIS_BUS_URL: redis://redis:6379/1
      REDIS_BROKER_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/3
      REDIS_LIMITS_URL: redis://redis:6379/4
      STORAGE_PROVIDER: s3
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_BUCKET: arena64-media
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_BASE_URL: https://${ARENA64_DOMAIN}/media
      PUBLIC_APP_URL: https://${ARENA64_DOMAIN}
      # The server-side half of the CSRF defence for the browser refresh
      # cookie. `Settings` refuses to start a deployed tier with an empty
      # list, because that leaves only the browser's SameSite guarantee —
      # and this stack failed to boot on exactly that guard the first time
      # it ran, which is what a staging environment is for.
      BROWSER_SESSION_TRUSTED_ORIGINS: '["https://${ARENA64_DOMAIN}"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMAIL_VERIFICATION_OTP_SECRET: ${EMAIL_VERIFICATION_OTP_SECRET}
    command: ["alembic", "upgrade", "head"]

  # --- the edge ------------------------------------------------------------
  # Caddy, for one reason: it obtains and renews TLS certificates on its own.
  # A staging tier whose certificate expires silently is one nobody trusts
  # the next failure of.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARENA64_DOMAIN: ${ARENA64_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- backing services ----------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena64
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena64
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena64 -d arena64"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    # AOF, because index 0 holds live match state — AD-18 is explicit that
    # this is the one Redis role the platform wants to survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and makes it publicly readable, then exits. Avatars are
  # public objects — `core/storage.py` says so and `get_public_url` composes
  # an unsigned URL on that basis — so the bucket has to actually be readable
  # without credentials, or every avatar renders as a broken image.
  minio-provision:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set staging http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing staging/arena64-media &&
      mc anonymous set download staging/arena64-media
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
