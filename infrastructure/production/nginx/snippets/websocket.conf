# The realtime gateway — A64-028.6A §12, §23.
#
# `/ws` is the path `app/gateway/router.py` declares
# (`@gateway_router.websocket("/ws")`), mounted at the application root and
# unversioned because a socket negotiates its protocol version in band.
#
# ## Three things a normal proxy location gets wrong
#
# **The upgrade.** `Connection` is a hop-by-hop header, so nginx drops it
# unless told otherwise. Without these two lines the handshake returns 200
# and the client sees a broken socket rather than an error — the failure
# mode that is hardest to diagnose from either end.
#
# **The timeout.** `proxy_read_timeout` counts silence, and a game between
# moves is silent. The 30 s default in `proxy.conf` would sever a socket
# during any pause longer than half a minute, which is most of them. A64-028.5A
# held 2 000 idle sockets for exactly this reason.
#
# **The buffering.** A buffered response is one nginx accumulates before
# forwarding. For a stream that is the whole point of, that is not a
# performance choice, it is a defect: a move would sit in nginx until the
# buffer filled or the connection closed.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# PROPOSED PRODUCTION DEFAULT. Longer than any silence a live game
# produces, shorter than a socket nobody is on the other end of. The
# application's own heartbeat (`GATEWAY_HEARTBEAT_TIMEOUT_SECONDS`) is the
# real liveness check; this is the backstop for a connection the application
# has already stopped tracking.
proxy_connect_timeout 5s;
proxy_read_timeout 1h;
proxy_send_timeout 1h;

proxy_buffering off;
proxy_request_buffering off;
