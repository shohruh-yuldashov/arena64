[project]
name = "arena64-api"
version = "0.1.0"
description = "Arena64 backend — HTTP, WebSocket, and worker profiles under one deployable artifact (architecture.md AD-02)"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

# --- Build backend -----------------------------------------------------------
# hatchling: no legacy setup.py, minimal configuration, actively maintained.
# Packaging (rather than relying on CWD imports) is what lets tests import the
# *installed* package — services.md §1 flags a flat/uninstalled layout as the
# way tests accidentally pass against files that were never packaged.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff ----------------------------------------------------------------
# Lint/format tool choice is not yet ratified by an ADR (coding-standards.md
# is a placeholder). Ruff is applied here as the working default — boring,
# single-binary, replaces flake8+isort+black — and should be confirmed or
# replaced by that ADR rather than treated as final.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Pyright -----------------------------------------------------------------
# A second type checker, not a replacement for mypy. They disagree in both
# directions and each catches things the other misses — A64-010 found
# Pyright correctly rejecting a `*args` stand-in for a Protocol method that
# mypy accepted, while mypy correctly accepts pydantic-settings'
# `_env_file` that Pyright cannot see. Running both is what makes those
# disagreements visible instead of arbitrary.
#
# `standard` rather than `strict`: mypy already runs in strict mode over
# the same tree, and a second maximal checker mostly produces duplicate
# findings plus its own false positives on the same pydantic dynamism.
[tool.pyright]
include = ["app", "tests", "main.py", "alembic/env.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# --- Mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# --- Pytest ------------------------------------------------------------------
# ENVIRONMENT=test is set in tests/conftest.py before app imports, not here —
# keeps the test environment free of an extra plugin dependency.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
