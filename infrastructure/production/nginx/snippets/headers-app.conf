# Every response on the product host — A64-028.6A §19, §20.
#
# One include per location, rather than two, because the failure this
# guards against is a location that forgets one of them. See
# `headers-common.conf` for why `add_header` cannot be inherited and why
# every directive carries `always`.

include /etc/nginx/snippets/headers-common.conf;

# A Content-Security-Policy written against what this application actually
# loads, rather than one copied from an article.
#
#   script-src   'self' plus two SHA-256 hashes. `index.html` carries a
#                blocking inline script that sets the theme class before
#                first paint — an external file there would be a
#                render-blocking round trip and a flash of the wrong theme.
#                Hashes rather than 'unsafe-inline', so *those two* scripts
#                are allowed and no other inline script is.
#                `tests/unit/test_edge_policy.py` recomputes them from the
#                built HTML and fails when they drift.
#   style-src    'unsafe-inline' is required and is the one concession.
#                React sets element styles and Tailwind emits inline custom
#                properties; there is no hash that survives a re-render.
#                Style injection cannot execute code, which is why this is a
#                different order of risk from the script directive.
#   connect-src  same origin covers the API **and the WebSocket** — a `wss://`
#                to the same host is same-origin for CSP, which is the whole
#                reason the client and the API share one origin.
#   img-src      `data:` for inline icons, `blob:` for canvas-rendered board
#                exports, same origin for avatars via /media.
#   frame-ancestors 'none' replaces X-Frame-Options, which it supersedes.
#
# No `unsafe-eval` anywhere, and no wildcard source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Asl+ROqZKKcKoexLQN7fhxZOiFSDP/yEj8/42vfLnog=' 'sha256-EjOprghzgzKvVjdj1gTxBLJEK1lRGo5dJkXRAdCXavk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# HTTP/3 advertisement — §9. An advertisement, not a redirect: a client that
# cannot reach UDP 443 simply never upgrades, which is what makes the
# HTTP/2 fallback the absence of a step rather than a path that has to work.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
