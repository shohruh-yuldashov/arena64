# Port 80 — A64-028.6A §5.
#
# Two jobs and nothing else: answer the ACME challenge, and send everything
# else to HTTPS.
#
# ## Why 301 and not 308
#
# The redirect applies to `GET` and `HEAD` in practice — a browser that has
# never seen this site fetches a page — and 301 is the one every client,
# crawler and preload scanner treats identically. 308 preserves the method,
# which matters for a `POST`; but a `POST` arriving on port 80 has already
# sent its body in the clear, and redirecting it invites the client to send
# it again rather than telling anyone it happened. HSTS is what stops the
# second visit reaching this block at all.
#
# ## Why the challenge path is excluded
#
# `certbot` proves control of the domain by serving a file under
# `/.well-known/acme-challenge/` over **plain HTTP**. Redirecting it would
# make the first issuance impossible — there is no certificate yet — and
# every renewal after it. The `^~` prefix beats any regex location, so this
# cannot be shadowed by a later block.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Served from a volume `certbot` writes into. The directory holds
    # nothing but challenge tokens, which are public by construction and
    # meaningless once used.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
