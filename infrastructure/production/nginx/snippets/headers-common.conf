# Every response, on every host — A64-028.6A §19.
#
# ## The `add_header` footgun this file exists to survive
#
# Nginx does **not** merge `add_header` down a location tree. A `location`
# that declares even one `add_header` of its own **discards every one**
# inherited from the server block. So a security header set once at the top
# is absent from any location that later adds a `Cache-Control`, and there is
# nothing in the configuration to say so — the header simply stops appearing.
#
# Caddy's `header` directive does not behave this way, so this is the one
# migration risk with no counterpart in the file being replaced.
#
# The answer is to include this file in **every** context that sets a header
# of its own, and to test the result over real HTTP rather than reasoning
# about it. `tests/unit/test_edge_policy.py` checks the inclusion is
# present; the deployment verification checks the headers arrive, including
# on 404 and on an error page.
#
# ## Why every directive carries `always`
#
# Without it `add_header` applies only to 200, 201, 204, 301, 302, 303, 304,
# 307 and 308. A 404, a 502 or a 401 would carry none of these — and a 4xx
# is exactly where a framing or sniffing protection matters, because it is
# the response an attacker can most easily provoke.

# Two years, subdomains included, preload-eligible. HSTS is the one header
# whose absence is exploitable on the *first* request of a session, which is
# the one a downgrade attack wants.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The browser must not second-guess a Content-Type. Sniffing is how an
# uploaded avatar becomes a script.
add_header X-Content-Type-Options "nosniff" always;

# Same-origin referrers keep the request id useful in the API's own logs;
# cross-origin gets the origin only, never the path — a game URL carries a
# match id and a settings URL says where the player was.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The platform asks for none of these. Stated rather than omitted: an empty
# allowlist is a decision a reader can check, and a missing header is a
# question.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
