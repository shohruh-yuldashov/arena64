# Local development infrastructure — Postgres and Redis only. No
# Kubernetes, no application container: `apps/api` runs on the host via
# `uv run uvicorn main:app --reload` against these two services, so a
# code change is visible without a rebuild.
#
# Values match apps/api/.env.example exactly. Run from the repo root:
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Host ports are overridable (`POSTGRES_PORT`, `REDIS_PORT`), and their
# defaults are **55432** and 6379.
#
# Postgres is deliberately not on 5432. Almost every machine that runs this
# project also runs a system Postgres on the standard port, so a default of
# 5432 fails to bind — and the failure is worse than an error, because it
# only appears when the container is recreated without an override somebody
# had been typing by hand. A default nobody has to remember is the whole
# point: this repository owns 55432, and the host's own Postgres keeps 5432.
#
# Redis stays on 6379: nothing on a typical development machine claims it,
# and moving it would change five role URLs for no reason.
#
#   POSTGRES_PORT=45432 REDIS_PORT=56379 docker compose -f docker/docker-compose.yml up -d
#
# One Redis instance, six logical databases. AD-03's role-separated pools
# share one process in `local`, per architecture.md §4's own note that this
# is acceptable outside production, where each role gets its own instance,
# sized and persistence-configured for its own workload:
#
#   0  live    live match position and clocks
#   1  bus     pub/sub fan-out
#   2  broker  Celery task queues
#   3  cache   response cache, read models, and presence (A64-012.7)
#   4  limits  rate limit counters (A64-011.8) — the fifth role, added
#              because a counter evicted under memory pressure is a limit
#              that disappears during the traffic spike it exists for
#   15 tests   tests/contract/ flushes whatever it is given, so it is
#              given an index none of the five roles points at
#
# What lives under which key prefix, with owners and TTLs, is
# docs/01-architecture/caching.md.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena64
      POSTGRES_PASSWORD: arena64
      POSTGRES_DB: arena64
    ports:
      # Host 55432, container 5432. See this file's header on why the host
      # side is not the standard port.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - arena64_postgres_data:/var/lib/postgresql/data
      # Runs once, only against a fresh volume — creates `arena64_test`
      # alongside the `arena64` (dev) database `POSTGRES_DB` provisions.
      # tests/contract/ points at the former; nothing under `local` ever
      # points at it. See tests/contract/conftest.py.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena64 -d arena64"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # AOF persistence: the live-match-state role (index 0) is the one Redis
    # role this platform ever wants to survive a restart, per AD-18. The
    # other roles' disposability (AD-19) does not require the *instance* to
    # skip persistence, only that nothing depends on it doing so — running
    # one shared policy in `local` is simpler and costs nothing a
    # development machine notices.
    #
    # **No `maxmemory-policy` here, and that is a `local`-only shortcut.**
    # A deployed tier configures eviction per role and the two settings are
    # opposites: `cache` (index 3) evicts by design, while `limits`
    # (index 4) must evict nothing, because a dropped counter is a limit
    # that silently stops applying. One process cannot hold both policies,
    # which is a large part of why AD-03 splits the instances at all.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - arena64_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arena64_postgres_data:
  arena64_redis_data:
