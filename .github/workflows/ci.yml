# Continuous integration — every gate this repository already declares.
#
# CLAUDE.md §5.10 requires lint, type checks and the full test suite to pass
# before a merge. Until this file existed there was nothing that ran them:
# every gate was run by hand, and by hand they were not always run. What that
# cost is on the record — #101 merged four admin phases with the routers
# mounted at two prefixes, #104 repaired suites that had been failing unread,
# and `ruff` had never been run over `alembic/versions/` at all.
#
# The jobs mirror the commands in README.md §Quality Gates exactly. If one
# changes, the other is wrong.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: the older run is
# reporting on a diff nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- what changed ----------------------------------------------------------
  # Which of the three applications a pull request actually touches, so a
  # one-line change to `apps/web` does not run 4239 Python tests against real
  # Postgres, Redis and MinIO for fourteen minutes. Four of this epic's pull
  # requests were frontend-only and each paid that price.
  #
  # **Pull requests are filtered; pushes to `main` are not.** A merge to
  # `main` is what gates publishing an image, and an image built from a
  # commit whose backend suite was skipped is one nobody can trust. The
  # saving belongs in the iteration loop, not in the gate.
  #
  # Written with `git diff` rather than a filter action: this is one command
  # and a `case`, and the repository's rule on dependencies applies to a
  # workflow as much as to `pyproject.toml`.
  #
  # **A documentation-only pull request runs no job at all**, which is
  # correct and worth knowing before branch protection is turned on: a
  # required check that never runs is one a merge can end up waiting for.
  # If these are ever made required, they need GitHub's "skipped counts as
  # success" behaviour, or a job that always succeeds standing in for them.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the comparison is against the merge
          # base and a shallow clone does not have one.
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — every job runs"
            {
              echo "api=true"
              echo "web=true"
              echo "admin=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base...HEAD")
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          # The workflow itself and the pinned Node version affect every job,
          # so a change to either runs all three. Being wrong in this
          # direction costs minutes; being wrong the other way ships
          # untested code.
          shared=$(echo "$changed" | grep -E '^(\.github/workflows/|\.nvmrc$)' || true)

          matches() {
            if [ -n "$shared" ]; then return 0; fi
            echo "$changed" | grep -qE "$1"
          }

          matches '^apps/api/' && api=true || api=false
          matches '^apps/web/' && web=true || web=false
          matches '^apps/admin/' && admin=true || admin=false

          echo "api=$api web=$web admin=$admin"
          {
            echo "api=$api"
            echo "web=$web"
            echo "admin=$admin"
          } >> "$GITHUB_OUTPUT"

  api:
    name: api — lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The real backing services, not stand-ins. `tests/contract/` skips when
    # either is unreachable (see its conftest), so without these the job would
    # pass having silently skipped a third of the suite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arena64
          POSTGRES_PASSWORD: arena64
          POSTGRES_DB: arena64
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena64 -d arena64"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    env:
      # `ci` rather than `test`: both scale the rate limits by the same
      # factor (docs/02-development/testing.md), and this one is the tier
      # that describes where the process is actually running.
      ENVIRONMENT: ci
      # The contract suites read these; their defaults name the ports
      # docker/docker-compose.yml publishes on a developer's machine, which
      # are not the ports a service container publishes here.
      CONTRACT_TEST_POSTGRES_DSN: postgresql+asyncpg://arena64:arena64@localhost:5432/arena64_test
      CONTRACT_TEST_REDIS_URL: redis://localhost:6379/15
      CONTRACT_TEST_S3_ENDPOINT_URL: http://localhost:9000
      CONTRACT_TEST_S3_BUCKET: arena64-media
      CONTRACT_TEST_S3_ACCESS_KEY_ID: arena64
      CONTRACT_TEST_S3_SECRET_ACCESS_KEY: arena64-secret
      # And the application's own settings, for the same reason: their code
      # defaults name 55432, which is the host port compose publishes and not
      # the one a service container does. Nothing in the suite is expected to
      # open these — `build_contract_app` injects the session — but a default
      # pointing at a port with nothing behind it turns any test that does
      # into a connection timeout rather than a readable failure.
      POSTGRES_DSN: postgresql+asyncpg://arena64:arena64@localhost:5432/arena64
      REDIS_LIVE_URL: redis://localhost:6379/0
      REDIS_BUS_URL: redis://localhost:6379/1
      REDIS_BROKER_URL: redis://localhost:6379/2
      REDIS_CACHE_URL: redis://localhost:6379/3
      REDIS_LIMITS_URL: redis://localhost:6379/4

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      # An exact tag, not a floating major: this action publishes `v1`
      # through `v7` as moving majors and nothing above, so `@v10` does
      # not resolve at all — the job failed before running a step of its
      # own. Pinning the patch is what CLAUDE.md §2.6 asks for anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install
        run: uv sync --frozen --extra dev

      # `docker/postgres/init/` runs only against a fresh compose volume, so
      # the contract database has to be created explicitly here. Same name and
      # owner as that script, for the same reason: a test that escapes the
      # rollback fixture must not be able to reach the development database.
      #
      # Through `asyncpg` rather than `psql`: the runner image documents a
      # PostgreSQL *server* and does not promise the client binaries, while
      # asyncpg is a runtime dependency of this application and is therefore
      # present the moment `uv sync` finishes. It also connects exactly the
      # way the platform does.
      # A64-027.1. The object store the S3 provider signs against. Unit tests
      # pin the request it composes; only a real implementation can say
      # whether that signature is **accepted**, and a canonical request wrong
      # by one newline is a well-formed request and a 403. MinIO proves it for
      # S3, R2 and B2 alike, because all three speak this protocol.
      #
      # A step rather than a `services:` entry, and that is not a style
      # choice. A GitHub service container accepts `image`, `env`, `ports`
      # and `options` — there is **no way to pass a command**, and `minio`
      # is not a server without `server /data`. Declared as a service it
      # starts, prints its usage, exits, and fails its healthcheck, which is
      # exactly what it did the first time this was written.
      - name: Start the object store
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=arena64 \
            -e MINIO_ROOT_PASSWORD=arena64-secret \
            minio/minio:latest server /data
          # Readiness, not a fixed sleep: a sleep is either too short on a
          # slow runner or wasted on a fast one.
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              echo "object store ready"
              exit 0
            fi
            sleep 1
          done
          echo "object store did not become ready" >&2
          docker logs minio >&2
          exit 1

      # The bucket the storage contract test writes to, and the public
      # read policy `get_public_url`'s unsigned URLs depend on. Created here
      # for the same reason the contract database is: a store starts empty,
      # and `docker compose`'s provisioning step is not part of this job.
      - name: Create the media bucket
        run: |
          docker run --rm --network host \
            --entrypoint sh minio/mc:latest -c "
              mc alias set ci http://localhost:9000 arena64 arena64-secret &&
              mc mb --ignore-existing ci/arena64-media &&
              mc anonymous set download ci/arena64-media
            "

      # `pg_dump` and `pg_restore`, at the **same major** as the server.
      #
      # The runner image ships a PostgreSQL 16 client on `PATH`; the service
      # container above, `docker/docker-compose.yml` and the production
      # compose all run `postgres:17`. `pg_dump` refuses to dump a server
      # newer than itself — it does not degrade, it aborts:
      #
      #     pg_dump: error: aborting because of server version mismatch
      #     detail: server version: 17.11; pg_dump version: 16.15
      #
      # That took the whole backup and restore suite down — ten contract
      # tests and one unit test — so the one gate that proves a backup can
      # actually be restored was the gate that never ran. A64-029.
      #
      # The version is derived from the service image rather than repeated,
      # so the two cannot drift apart the way they just did.
      - name: Install the PostgreSQL client
        run: |
          set -euo pipefail
          major="$(docker exec "$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)" \
            postgres --version | grep -oE '[0-9]+' | head -1)"
          echo "server major: ${major}"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${major}"
          # `pg_dump` must resolve to the new client, not the runner's 16.
          echo "/usr/lib/postgresql/${major}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${major}/bin/pg_dump" --version

      - name: Create the contract database
        run: |
          uv run python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://arena64:arena64@localhost:5432/arena64"
              )
              try:
                  await connection.execute("CREATE DATABASE arena64_test OWNER arena64")
              finally:
                  await connection.close()


          asyncio.run(main())
          PY

      # Each gate is its own step so a failure names itself in the summary,
      # and `if: always()` so one failure does not hide the others — a run
      # that reports "lint failed" and nothing else costs a second round trip
      # to learn the types are broken too.
      - name: ruff — lint
        run: uv run ruff check .

      - name: ruff — format
        if: always()
        run: uv run ruff format --check .

      - name: import-linter — architecture contracts
        if: always()
        run: uv run lint-imports

      - name: mypy — strict
        if: always()
        run: uv run mypy .

      - name: pyright
        if: always()
        run: uv run pyright

      - name: pytest
        if: always()
        run: uv run pytest

  web:
    name: web — lint, types, tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # `.nvmrc`, not a floating major. `node-version: 24` resolved to
          # whatever 24.x the runner image carried — 24.19.0 against a lock
          # written by 24.13.0 — and the two ship different npm versions,
          # which resolve `@tailwindcss/oxide-wasm32-wasi`'s bundled
          # dependencies at different patches. `npm ci` then refused a lock
          # that was correct on the machine that wrote it. One version, named
          # once, is what makes the lock mean the same thing in both places.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        if: always()
        run: npm run typecheck

      - name: prettier
        if: always()
        run: npm run format:check

      - name: vitest
        if: always()
        run: npm run test

  admin:
    name: admin — lint, types, tests
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # `.nvmrc`, not a floating major. `node-version: 24` resolved to
          # whatever 24.x the runner image carried — 24.19.0 against a lock
          # written by 24.13.0 — and the two ship different npm versions,
          # which resolve `@tailwindcss/oxide-wasm32-wasi`'s bundled
          # dependencies at different patches. `npm ci` then refused a lock
          # that was correct on the machine that wrote it. One version, named
          # once, is what makes the lock mean the same thing in both places.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        if: always()
        run: npm run typecheck

      - name: prettier
        if: always()
        run: npm run format:check

      - name: vitest
        if: always()
        run: npm run test

  # --- publish ---------------------------------------------------------------
  # Builds the image and pushes it, and does so **only** for a commit that has
  # already passed every gate above. `needs` is what makes that true rather
  # than hopeful: a red suite means no image, so a tag in the registry is a
  # tag somebody can deploy without asking what state it was in.
  #
  # Pull requests do not publish. A fork could otherwise push to this
  # repository's registry, and a tag that moved on every proposal would make
  # `latest` meaningless.
  publish:
    name: publish the api image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web, admin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # The one job that writes anything. Scoped here rather than at the
      # workflow, so the three test jobs keep the read-only token they have.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no secret to rotate and nothing stored in
          # this repository.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags for one image, and both are needed. `latest` is what
      # `infrastructure/staging/compose.yml` follows by default so a staging
      # host can pull without being told a version. The commit SHA is what
      # makes a deployment reproducible: `latest` says "whatever was newest",
      # and a report about a bug needs to name the build it came from.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/arena64-api:latest
            ghcr.io/${{ github.repository_owner }}/arena64-api:${{ github.sha }}
          # The registry is also the cache. A build that reuses the previous
          # layers takes seconds; without it every merge rebuilds the whole
          # dependency layer for a source change of two lines.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arena64-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arena64-api:buildcache,mode=max
