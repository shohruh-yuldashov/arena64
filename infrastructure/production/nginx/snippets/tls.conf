# TLS policy — A64-028.6A §7.
#
# ## Protocols
#
# 1.3 and 1.2. Nothing older: 1.0 and 1.1 are deprecated by RFC 8996 and
# every browser Arena64 targets has supported 1.2 since 2013. 1.2 stays
# because dropping it buys nothing security-wise — its modern cipher suites
# are sound — and costs older Android and corporate middleboxes.
#
# ## Ciphers
#
# **Not listed.** A hand-written 40-entry cipher string is the cargo-cult
# §7 warns about: it freezes a judgement made once against an OpenSSL that
# keeps moving, and every such string on the internet eventually names
# something that has since been broken. OpenSSL 3's own defaults are
# maintained by people who do this full time.
#
# 1.3's suites are not configurable through `ssl_ciphers` at all — the
# protocol fixes them — so this would only ever have governed 1.2, where the
# default is already AEAD-only.
#
# `ssl_prefer_server_ciphers off` is the modern recommendation: the client
# knows which suites its hardware accelerates, and a server overriding that
# picks a slower one for the sake of an ordering that no longer differs in
# strength.
#
# ## Session resumption
#
# A shared cache rather than tickets. Tickets are encrypted with a key that,
# without rotation, breaks forward secrecy for every session it covers —
# and rotating it across processes is machinery this deployment does not
# need. `ssl_session_tickets off` costs a full handshake for a client that
# reconnects to a different worker, which is cheap on 1.3.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling: the browser gets the revocation proof from this server
# rather than fetching it from the CA, which is one fewer third party in
# the connection path and one fewer thing that can be slow.
ssl_stapling on;
ssl_stapling_verify on;
# The `resolver` OCSP stapling needs is declared once in `nginx.conf`'s
# `http` block, where upstream resolution needs it too. Declaring it again
# here would be a second source of truth for the same setting.
