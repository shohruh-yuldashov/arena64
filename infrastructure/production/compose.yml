# The production topology — A64-028.6 §2, §12, §13.
#
#   docker compose --env-file production.env up -d
#
# ## What this closes
#
# A64-028.1's P0-2: staging defines `api`, `migrate`, an edge, `postgres`,
# `redis`, `minio` and **no client**, so the edge proxied every path to the
# API and `/` returned the API's 404. There is now a `web` and an `admin`
# whose build output the edge serves.
#
# A64-028.6A replaced the Caddy edge with nginx. See
# `docs/01-architecture/deployment.md` §8 for the migration and what changed
# mechanically; `infrastructure/staging/` still runs Caddy and is explicitly
# not a production definition.
#
# ## The shape, and the two roles that are not the same process
#
#   migrate   one-shot, runs to completion before anything serves. A schema
#             change is a deployment step, never something a replica does to
#             a database other replicas are already using.
#   api-1/2   stateless, named replicas sharing the alias `api`,
#             **schedulers off**.
#   worker    exactly one, schedulers and the outbox relay on.
#   nginx     the only container with published ports.
#   certbot   the certificate lifecycle nginx does not manage itself.
#
# The api/worker split is the whole reason it is safe to scale `api`.
# A64-028.1's audit found the trap: every scheduled job is gated by a
# per-process boolean that **defaults to true**, so N replicas of one image
# run N copies of every sweep. The handlers are individually safe under
# concurrency — they claim with `FOR UPDATE SKIP LOCKED` and count the races
# they lose — but "safe" is not "intended", and N pairing scanners a second
# is load nobody asked for. Here the flags are set explicitly on both
# services, so the shape is visible in this file rather than inferred from
# defaults.
#
# `docs/01-architecture/deployment.md` carries the same table in prose,
# including what must change before a second host exists.

# Every image is pinned to a tag that does not move — A64-028.7's audit
# found `certbot/certbot`, `minio/minio` and `minio/mc` on `:latest`.
#
# `latest` is not a version: a rebuild silently changes what runs, a
# rollback cannot name what to go back to, and a compromised upstream tag is
# pulled on the next restart. The rest of the file already used minor or
# release tags; these three did not.
#
# The API image is the exception and deliberately so: `ARENA64_TAG` is the
# release being deployed, which is the one thing that *should* move.

name: arena64

x-api-image: &api-image
  image: ghcr.io/shohruh-yuldashov/arena64-api:${ARENA64_TAG:-latest}

x-api-env: &api-env
  ENVIRONMENT: production
  APP_LOG_FORMAT: json
  # At or below the scrape interval, or `rate()` reads the flush steps
  # rather than the traffic — `platform/metrics/runtime.py` says why
  # counters arrive in steps at all.
  APP_METRICS_FLUSH_INTERVAL_SECONDS: "15"
  POSTGRES_DSN: postgresql+asyncpg://arena64:${POSTGRES_PASSWORD}@postgres:5432/arena64
  # Sized for this host rather than left on the code default of 10 + 5 —
  # A64-030.2 (B-4), and `deployment.md` §9.2's connection-budget row.
  #
  # One uvicorn process per container, single-threaded, with a 5-second
  # statement timeout: it cannot usefully hold fifteen backends, and every
  # idle backend costs PostgreSQL five to ten megabytes of a container now
  # capped at 1280M. Ten apiece bounds the whole tier at
  #
  #   api-1 10 + api-2 10 + worker 10           = 30 steady
  #   + migrate 1 + backup's pg_dump 1          = 32 during a deploy
  #
  # against `max_connections` 100 with three reserved for a superuser, so
  # an operator can always get in. The code default stays 10 + 5 — this is
  # host sizing, not a platform decision.
  POSTGRES_POOL_SIZE: "5"
  POSTGRES_MAX_OVERFLOW: "5"
  # One instance, five logical databases, one password — see the `redis`
  # service on why the instance is shared and why it is authenticated.
  # `REDIS_PASSWORD` must be hex or otherwise URL-safe: it is userinfo in
  # these URLs and nothing percent-encodes it.
  REDIS_LIVE_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_BUS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  REDIS_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
  REDIS_LIMITS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
  # One proxy in front of the application. This number and the Caddyfile's
  # `header_up X-Forwarded-For` must agree: a limiter that trusts the wrong
  # hop either rate-limits the proxy as one client or accepts a spoofed
  # address from a real one.
  RATE_LIMIT_TRUSTED_PROXY_COUNT: "1"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  EMAIL_VERIFICATION_OTP_SECRET: ${EMAIL_VERIFICATION_OTP_SECRET}
  PUBLIC_APP_URL: https://${ARENA64_DOMAIN}
  BROWSER_SESSION_TRUSTED_ORIGINS: '["https://${ARENA64_DOMAIN}"]'
  RESEND_API_KEY: ${RESEND_API_KEY}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
  EMAIL_FROM_NAME: Arena64
  STORAGE_PROVIDER: s3
  STORAGE_S3_ENDPOINT_URL: http://minio:9000
  STORAGE_S3_BUCKET: arena64-media
  STORAGE_S3_REGION: auto
  STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  STORAGE_PUBLIC_BASE_URL: https://${ARENA64_DOMAIN}/media
  # The operator surface. The tier refuses to start without one of these
  # two being set — see `Settings._guard_production_observability`.
  OPS_TOKEN: ${OPS_TOKEN}
  # Backups — A64-028.7 (P2-8). The tier refuses to start without both.
  OPS_BACKUP_ENCRYPTION_KEY: ${OPS_BACKUP_ENCRYPTION_KEY}
  OPS_BACKUP_OFFSITE_ENDPOINT: ${OPS_BACKUP_OFFSITE_ENDPOINT}
  OPS_BACKUP_OFFSITE_BUCKET: ${OPS_BACKUP_OFFSITE_BUCKET}
  OPS_BACKUP_OFFSITE_REGION: ${OPS_BACKUP_OFFSITE_REGION:-us-east-1}
  OPS_BACKUP_OFFSITE_PREFIX: ${OPS_BACKUP_OFFSITE_PREFIX:-production}
  OPS_BACKUP_OFFSITE_ACCESS_KEY_ID: ${OPS_BACKUP_OFFSITE_ACCESS_KEY_ID}
  OPS_BACKUP_OFFSITE_SECRET_ACCESS_KEY: ${OPS_BACKUP_OFFSITE_SECRET_ACCESS_KEY}

# Everything the two API replicas share. Split from the image anchor so the
# replicas differ in nothing but their name, their alias and their node id —
# a difference between them is a difference nobody would find until traffic
# landed on the wrong one.
x-api-common: &api-common
  restart: unless-stopped
  # `stop_grace_period` is the window between SIGTERM and SIGKILL. The deploy
  # is expected to have called `POST /health/drain` before this point, so the
  # window only has to cover requests already in flight — A64-028.5A measured
  # p99 at 616 ms and a maximum of 1.45 s under a 35-minute mixed load.
  # Thirty seconds is that with room, and is a PROPOSED OPERATIONAL DEFAULT
  # rather than a measured requirement.
  stop_grace_period: 30s
  expose: ["8000"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

# The replicas' environment, separated from `x-api-common` so each service
# can add the one key that must differ between them — `GATEWAY_NODE_ID`.
# YAML merge keys do not merge nested maps: a service declaring its own
# `environment:` would *replace* an inherited one rather than extend it, so
# the block a replica overrides has to be this one and not the whole of
# `x-api-common`.
x-api-replica-env: &api-replica-env
  <<: *api-env
  OUTBOX_WORKER_ENABLED: "false"
  MATCHMAKING_PAIRING_ENABLED: "false"
  MATCHMAKING_EXPIRY_ENABLED: "false"
  MATCHMAKING_RECONCILIATION_ENABLED: "false"
  MATCHMAKING_RETENTION_ENABLED: "false"
  MATCHMAKING_CHALLENGE_EXPIRY_ENABLED: "false"
  OUTBOX_RETENTION_ENABLED: "false"
  ANALYTICS_RETENTION_ENABLED: "false"
  PRESENCE_SWEEPER_ENABLED: "false"
  GAME_CLOCK_ENABLED: "false"
  # **On, on every replica, deliberately.** The gateway forwarder drains
  # this node's own cross-instance mailbox; a node that does not run it
  # receives no frames from anywhere else. A64-028.4 established that this
  # is one of the two tasks a leader election would break.
  GATEWAY_FORWARDING_ENABLED: "true"


# Log rotation — A64-028.7 §30, and it was missing.
#
# Docker's default `json-file` driver has **no size limit**. Every container
# here writes structured JSON to stdout — nginx logs a line per request, the
# API logs a line per metric flush — and without this the files grow until
# the disk does not have room for the database.
#
# It is applied to every service rather than the noisy ones, because "the
# noisy ones" is a judgement that ages: the next service to become chatty
# would be the one without a bound.
#
# 10 MB × 5 is about a day of the edge's access log at a modest rate and
# costs 50 MB per container. A **PROPOSED OPERATIONAL DEFAULT** — the right
# number depends on the disk, which is a HOST-SIZING GATE.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"


# Resource bounds — A64-030.2 (B-4), closing `deployment.md` §9.2's
# "Container memory and CPU limits: **unset**".
#
# ## Why they were unset until now, and why they are set now
#
# §9.2 refused to invent them before the machine existed, and it was right
# to: a wrong limit turns a busy hour into an OOM kill. The machine now
# exists — netcup RS 1000 G12, **4 vCPU, 7.75 GiB, 4 GiB swap** — so the
# numbers below are host sizing rather than guesswork.
#
# ## The envelope
#
#   3.13 GiB   reservations — what the tier is expected to occupy, so
#              ~3.6 GiB is left for the OS and the page cache, which is
#              doing most of PostgreSQL's caching work because
#              `shared_buffers` is deliberately small
#   6.00 GiB   every container ceiling added together
#   1.00 GiB   Ubuntu, the Docker daemon and containerd
#
# Ceilings are oversubscribed against reservations on purpose: the gap is
# what absorbs a spike without anything being killed. What matters is that
# ceilings **plus** the OS reserve still sum to less than RAM — 7.0 of
# 7.75 GiB — so the thing that acts first under pressure is a per-container
# limit and not the kernel's OOM killer, which is not obliged to choose a
# good victim.
#
# **Swap is not application capacity.** Nothing here is sized expecting to
# page. The 4 GiB is emergency protection, and `memswap_limit` is
# deliberately *not* pinned to `mem_limit` — converting a transient spike
# into an OOM kill of PostgreSQL is worse than a second of paging. Keeping
# the host off swap in normal operation is `vm.swappiness`, which is a host
# setting and not this file's to make.
#
# ## What Compose actually applies, and what it silently ignores
#
# Verified on this host against Compose v5.5.1 by creating a container and
# reading `HostConfig` back:
#
#   deploy.resources.limits.memory        -> Memory              APPLIED
#   deploy.resources.limits.cpus          -> NanoCpus            APPLIED
#   deploy.resources.reservations.memory  -> MemoryReservation   APPLIED
#   deploy.resources.reservations.cpus    -> nothing             IGNORED
#
# The last one is a Swarm scheduling hint with no meaning in the local
# runtime, and Compose neither applies nor complains about it. So the CPU
# half of the reservation envelope is expressed as `cpu_shares`, which is a
# real cgroup control — the relative weight a container gets **only when
# the host is saturated**, which is exactly what a CPU reservation means.
# It is never a cap: an idle host still lets any container reach its
# `limits.cpus`.
#
# The mapping is one rule: `cpu_shares = round(reserved cores × 1024)`.
#
# **Every resident service carries one, including the small ones, and that
# is not tidiness.** An unset `cpu_shares` is not "no weight", it is the
# Docker default of 1024 — so a service left out would outweigh PostgreSQL
# at 768 under exactly the contention this exists to arbitrate. Partial
# application would be worse than none. The eleven weights sum to 4 096,
# which is this host's four cores at that scale.
#
# The one-shot services — `migrate`, `web`, `admin`, `certbot-init`,
# `minio-provision` — are deliberately left at the default. They are
# transient, they run during a deploy rather than during steady state, and
# finishing them quickly is the goal.
#
# Only the API replicas share an anchor, because they are the only pair
# that must stay identical. Every other service states its own numbers
# where a reader is already looking at it.
#
# 390 MB steady under A64-028.5A's mixed load, plus the measured ~100 KB
# per idle WebSocket, puts 832M at roughly four thousand concurrent sockets
# before the ceiling becomes the binding constraint.
x-api-resources: &api-resources
  cpu_shares: 768
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 832M
      reservations:
        memory: 512M


services:
  # --- One-shot schema step -------------------------------------------------
  migrate:
    <<: [*api-image, *logging]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
    # A ceiling rather than a budget: this container is transient and holds
    # one connection, but it runs during a deploy, when the two replicas it
    # is about to release are still serving on their own reservations.
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy

  # --- Request serving, two named replicas, schedulers off ------------------
  #
  # Named rather than `deploy.replicas`, and the reason is the edge — A64-028.6A
  # §10. Nginx resolves upstream names through Docker's DNS at request time,
  # and both replicas carry the network alias `api`, so that name returns
  # every running container and DNS round-robins between them. Their
  # individual names are what a deploy addresses: draining is per instance.
  #
  # `GATEWAY_NODE_ID` is the one key that differs, and the only reason the
  # replica environment is a separate anchor. `app/gateway/node.py` draws a
  # random identifier when it is unset, which is *correct* — a restart
  # genuinely is a different process instance — and illegible: a route
  # resolving to `d4f1a2b8` says the connection is elsewhere just as well as
  # `api-2` does, but only the second can be found in a log search.
  api-1:
    <<: [*api-image, *api-common, *logging, *api-resources]
    environment:
      <<: *api-replica-env
      GATEWAY_NODE_ID: api-1
    networks:
      default:
        aliases: [api]

  api-2:
    <<: [*api-image, *api-common, *logging, *api-resources]
    environment:
      <<: *api-replica-env
      GATEWAY_NODE_ID: api-2
    networks:
      default:
        aliases: [api]

  # --- Scheduled work, exactly one ------------------------------------------
  worker:
    <<: [*api-image, *logging]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *api-env
      OUTBOX_WORKER_ENABLED: "true"
      MATCHMAKING_PAIRING_ENABLED: "true"
      MATCHMAKING_EXPIRY_ENABLED: "true"
      MATCHMAKING_RECONCILIATION_ENABLED: "true"
      MATCHMAKING_RETENTION_ENABLED: "true"
      MATCHMAKING_CHALLENGE_EXPIRY_ENABLED: "true"
      OUTBOX_RETENTION_ENABLED: "true"
      ANALYTICS_RETENTION_ENABLED: "true"
      PRESENCE_SWEEPER_ENABLED: "true"
      GAME_CLOCK_ENABLED: "true"
      # Off here: this process holds no WebSocket, so its mailbox is empty
      # and draining it every interval is a query for nothing.
      GATEWAY_FORWARDING_ENABLED: "false"
      # Read-only, and only so the worker can publish
      # `arena64_backup_last_success_timestamp_seconds`. The backup runs in
      # its own container; what that container cannot do is answer a scrape.
      OPS_BACKUP_DESTINATION: /var/backups/arena64
      # Read-only, and only to publish
      # `arena64_certificate_expiry_timestamp_seconds` — A64-028.6A §26.
      # The same shape as the backup destination above and for the same
      # reason: the container that owns the file cannot answer a scrape.
      OPS_CERTIFICATE_PATH: /etc/letsencrypt/live/${ARENA64_DOMAIN}/fullchain.pem
      # Named for the same reason as the replicas'. This process holds no
      # WebSocket, so nothing routes to its identifier — what a stable name
      # buys here is a log line an operator can attribute.
      GATEWAY_NODE_ID: worker
    cpu_shares: 512
    deploy:
      # **Exactly one, and that is the whole api/worker split.** Kept here
      # rather than beside the resource block because it is a correctness
      # constraint and not a sizing one: a second worker doubles every sweep.
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 640M
        reservations:
          memory: 384M
    volumes:
      - backup_data:/var/backups/arena64:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Clients, built to files ----------------------------------------------
  #
  # Both build to a minimal image whose only content is `dist/`, and the
  # edge serves it from the volume below. `restart: "no"` because there is
  # nothing to run: the container exits immediately and the volume keeps
  # what it copied.
  #
  # ## Why the copy clears first — A64-030.2 (N-8)
  #
  # The volume is persistent and the copy was additive, so a file **deleted**
  # in a later release survived in it for ever. That is not a cosmetic leak:
  # a stale `sw.js` is a service worker the browser keeps honouring, and a
  # stale hashed asset is a bundle the new `index.html` no longer references
  # but the old one still does.
  #
  # `find -mindepth 1 -maxdepth 1 -exec rm -rf {} +` rather than `rm -rf
  # /srv/web/*`: it removes dotfiles too, and it never names the mount point
  # itself, so there is no shape of this command that can delete the volume
  # rather than its contents. `cp -a` rather than `cp -r` so modes and
  # timestamps survive the copy — nginx serves these files directly.
  #
  # Both capabilities were verified against `busybox:1.37.0-musl`, which is
  # the shell these images actually carry.
  web:
    <<: *logging
    build:
      context: ../../apps/web
      args:
        VITE_PUBLIC_ORIGIN: https://${ARENA64_DOMAIN}
    image: arena64-web:${ARENA64_TAG:-latest}
    restart: "no"
    command: ["true"]
    volumes:
      - web_dist:/srv/web
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; find /srv/web -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /dist/. /srv/web/

  admin:
    <<: *logging
    build:
      context: ../../apps/admin
    image: arena64-admin:${ARENA64_TAG:-latest}
    restart: "no"
    command: ["true"]
    volumes:
      - admin_dist:/srv/admin
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; find /srv/admin -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /dist/. /srv/admin/

  # --- The only container with published ports ------------------------------
  #
  # A64-028.6A replaced Caddy with nginx. The rationale is in
  # `docs/01-architecture/deployment.md` §8; the short form is that it is an
  # architecture decision, not a technical dissatisfaction with Caddy, and
  # the behaviour A64-028.6 established is re-proved through nginx rather
  # than assumed to have survived.
  nginx:
    <<: *logging
    build:
      context: ./nginx
    image: arena64-nginx:${ARENA64_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 is QUIC over UDP on the same port number and a **different
      # protocol**, so it needs its own mapping. Without this line the
      # `Alt-Svc` advertisement points at a port nothing is listening on and
      # every client silently stays on HTTP/2 — which works, and hides that
      # HTTP/3 was never reachable.
      - "443:443/udp"
    environment:
      ARENA64_DOMAIN: ${ARENA64_DOMAIN}
    # --- The descriptor budget `worker_connections` needs — A64-030.2 (E-2)
    #
    # `nginx.conf` asks for 4096 connections per worker. Containers on this
    # host inherit a **soft `nofile` of 1024** (hard 524288; the daemon sets
    # no `default-ulimits`), and nginx said so at every start:
    #
    #     [warn] 4096 worker_connections exceed open file resource limit: 1024
    #
    # A connection is not one descriptor. A proxied request holds two — the
    # client socket and the upstream socket — so 1024 was a ceiling of about
    # five hundred concurrent requests per worker, on the only process on
    # this host that faces the internet. Nothing fails loudly when it is
    # reached: accepts stall and clients see a hang.
    #
    # Raised here rather than by lowering `worker_connections`, because 4096
    # is the number the edge was sized for and the descriptor limit is a
    # runtime default that happened to be smaller — the configuration was
    # right and the sandbox was wrong.
    #
    # Soft equals hard so nothing has to raise it at runtime, and 65535 is
    # comfortably inside this host's 524288 hard ceiling. It is a bound, not
    # a reservation: descriptors cost nothing until they are opened.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - web_dist:/srv/web:ro
      - admin_dist:/srv/admin:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # Reloads every six hours to pick up a renewed certificate — see
    # `certbot/renew.sh` on why the renewal container does not signal this
    # one directly. `exec` so nginx is PID 1 and `SIGTERM` reaches it.
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h; nginx -s reload; done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      certbot-init:
        condition: service_completed_successfully

  # --- Certificates ----------------------------------------------------------
  #
  # First issuance, once, then exit. Separate from renewal because issuance
  # fails for reasons renewal cannot — DNS not yet pointed here, port 80 not
  # open — and a loop that retried it for ever would hide that behind a
  # container that looks like it is working.
  certbot-init:
    <<: *logging
    image: certbot/certbot:v5.8.0
    restart: "no"
    environment:
      ARENA64_DOMAIN: ${ARENA64_DOMAIN}
      ARENA64_ACME_EMAIL: ${ARENA64_ACME_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./certbot/issue.sh:/usr/local/bin/issue.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/issue.sh"]

  certbot:
    <<: *logging
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    # The same two the init container reads: this loop finishes the issuance
    # that one starts, once nginx is up to answer the challenge — A64-029.
    environment:
      ARENA64_DOMAIN: ${ARENA64_DOMAIN}
      ARENA64_ACME_EMAIL: ${ARENA64_ACME_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./certbot/renew.sh:/usr/local/bin/renew.sh:ro
      # One issuance script, mounted into both containers that perform an
      # issuance. A second copy of these flags is a second thing to keep in
      # step with the certificate name — CLAUDE.md §3.4.
      - ./certbot/issue.sh:/usr/local/bin/issue.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/renew.sh"]
    cpu_shares: 51
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    depends_on:
      certbot-init:
        condition: service_completed_successfully

  # --- Stateful dependencies, none of them published ------------------------
  # ## Tuning — A64-030.2 (B-4), closing `deployment.md` §9.2's
  # "`shared_buffers`, `work_mem`: server defaults".
  #
  # A `command:` override rather than a mounted `postgresql.conf`, for the
  # reason the nginx image gives about baking its configuration: a mounted
  # file is a thing on the host that nothing versions and nothing reviews.
  # These flags are read in the same diff as the memory limit they are
  # sized against.
  #
  # **`shared_buffers` is deliberately not maximised.** The usual rule of
  # thumb is a quarter of RAM; a quarter of *this host's* RAM would be
  # 2 GiB, inside a container capped at 1280M, and PostgreSQL would be
  # killed before it filled it. 256MB is a quarter of the **container**,
  # and the rest of the caching is the OS page cache — which the envelope
  # above reserves 1.5 GiB for, and which `effective_cache_size` tells the
  # planner about without allocating a byte.
  #
  # `work_mem` is per **sort node**, not per connection, so it multiplies by
  # plan complexity as well as by concurrency. 4MB against the 32-connection
  # ceiling is 128 MB in the ordinary case. It is deliberately conservative:
  # an admin analytics query that wants more should say so with
  # `SET LOCAL work_mem`, which is bounded to that transaction.
  #
  # `random_page_cost` and `effective_io_concurrency` are the only two
  # numbers here derived from a measurement on this host: fio put 4 KiB
  # random reads at ~61.9k IOPS with a p99 of 1.16 ms, which is NVMe. The
  # stock `random_page_cost` of 4.0 describes a spinning disk and makes the
  # planner avoid index scans it should prefer.
  #
  # **Nothing here weakens durability.** `fsync`, `synchronous_commit` and
  # `full_page_writes` keep their defaults and are not listed, so no future
  # edit to this block can turn one off by looking like the others.
  postgres:
    <<: *logging
    image: postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - max_connections=100
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_checkpoints=on
      - -c
      - timezone=UTC
    environment:
      POSTGRES_USER: arena64
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arena64
    cpu_shares: 768
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1280M
        reservations:
          memory: 768M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena64 -d arena64"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ## One instance, five logical databases, one eviction policy
  #
  # `data-reliability.md` §3 states the deployment requirement as
  # `allkeys-lru` on `cache` and `noeviction` on `limits` and `live`. One
  # instance cannot express that — `maxmemory-policy` is instance-wide —
  # and splitting into five is five processes pretending to be five
  # machines on a 4-vCPU host. `deployment.md` §2 records the deviation.
  #
  # **So the tie is broken towards the failure that is loud.** With
  # `noeviction`, memory pressure fails writes: the rate limiter then fails
  # open **and increments `rate_limit_unavailable_total{failed_open}`**,
  # which is an alert. With `volatile-lru` — every key family here except
  # `clock:v1:deadlines` carries a TTL, so almost everything is a candidate
  # — Redis would instead silently evict `rl:` counters under exactly the
  # traffic spike the limiter exists for. A limit that quietly stops
  # applying is the failure `data-reliability.md` §3 names as unacceptable;
  # a degraded write that says so is not.
  #
  # `maxmemory` at all is the point. It was **unset**, which is unbounded,
  # on a host with 7.75 GiB. 256mb is far above any realistic beta working
  # set; the container ceiling is 768M because an AOF rewrite forks and
  # copy-on-write can approach a second copy of the dataset.
  #
  # `requirepass` is defence in depth — A64-030.2 (S-1). The instance
  # publishes no port and is reachable only on this network, but every
  # other container on it (certbot, minio-provision, node-exporter) could
  # otherwise read live match state and rate-limit counters. `REDISCLI_AUTH`
  # rather than `redis-cli -a` in the healthcheck: the flag prints a warning
  # to stderr on every invocation and puts the password in the container's
  # own `ps` output twice a second, which is a log nobody wanted.
  redis:
    <<: *logging
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          memory: 256M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *logging
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    cpu_shares: 154
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 192M
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-provision:
    <<: *logging
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/arena64-media &&
        mc anonymous set download local/arena64-media

  # --- Host metrics — A64-028.7, closing half of P3-4 ------------------------
  #
  # The application reports its own RSS and nothing about the machine it is
  # on, so `disk pressure` had a runbook and no alert. A disk that fills
  # takes PostgreSQL, the WAL, the backups and the logs at once, and the
  # first symptom is a database that will not write.
  #
  # `node_exporter` rather than anything larger: it is the maintained
  # standard, it is one static binary, and it publishes exactly the seven
  # things §9 asks for. No published port — Prometheus reaches it on the
  # compose network and nothing else can.
  node-exporter:
    <<: *logging
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    # Read-only host mounts. The exporter needs to see the host's `/proc`,
    # `/sys` and filesystems; it needs to write nothing anywhere.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Only the collectors the alerts read. The default set includes a
      # dozen this deployment has no use for, and every one of them is more
      # series to store and more surface to reason about.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.loadavg
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
      - --collector.uname
      - --collector.time
      - --collector.os
      # The container's own view of these is not the host's, and a
      # filesystem alert on an overlay is an alert about nothing.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|rootfs/var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|:binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    expose: ["9100"]
    pid: host
    cpu_shares: 51
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 32M

  # --- The thing that reads all of the above — A64-030.2 --------------------
  #
  # `infrastructure/observability/` has held a Prometheus configuration and
  # twenty-nine alert rules since A64-028.7, `node-exporter` has been
  # publishing host metrics into a compose network, `runbooks.md` says
  # "Prometheus runs on the same host as everything it watches", and every
  # runbook links an alert by name. **No compose file ran it.** Every one of
  # those rules was unarmed, including the two that would have caught the
  # backup defect above.
  #
  # Adding it is small because the configuration was already finished:
  # `promtool check config` accepts `prometheus.yml` against this image
  # unchanged, and `promtool check rules` reads all twenty-nine.
  #
  # ## Three things worth stating
  #
  # **No published port.** Prometheus holds the operator's whole view of the
  # platform and authenticates nobody. It is reachable on this network and
  # from `docker compose exec`, and from nowhere else — `deployment.md` §8.8
  # already names it in the list of things that must be unreachable.
  #
  # **The scrape credential is a file, not an environment variable**, because
  # `prometheus.yml` asks for `credentials_file` — the shape that keeps a
  # bearer token out of the process's own environment. It is delivered as a
  # compose `config` so the token has exactly one source, `production.env`,
  # and no second copy on the host filesystem to fall out of step. Mode 0444
  # rather than 0400 because this image runs as uid 65534 and a config is
  # mounted root-owned; the file's audience is one container that already
  # holds the token.
  #
  # **Retention is bounded twice.** Fifteen days is the answer to "how far
  # back does an incident review look"; the size bound is the answer to
  # "what happens if the series count grows", and it is the half that stops
  # `DiskWillFillSoon` being an alert about the alerting.
  prometheus:
    <<: *logging
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      # No `--web.enable-lifecycle` and no `--web.enable-admin-api`: both
      # add unauthenticated endpoints that reload configuration or delete
      # series, on a service with no authentication of its own.
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    expose: ["9090"]
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 384M
    volumes:
      - prometheus_data:/prometheus
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # `rule_files: [alerts.yml]` in that file is resolved relative to it,
      # so this path is not a free choice.
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    configs:
      - source: ops_token
        target: /etc/prometheus/ops-token
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Backup, on a schedule outside the application ------------------------
  #
  # A64-028.3 built the command and said the interval was A64-028.6's. It is
  # a container with a sleep loop rather than a periodic task inside the API
  # for the reason `backup-restore.md` §8 gives: a backup that only runs
  # while the application is healthy is a backup that stops exactly when it
  # is most needed.
  #
  # **The destination is a volume on this host, and that is not enough.**
  # `production-hardening.md` P2-8 owns encryption at rest and off-host
  # storage; this makes the backups exist and makes their age observable,
  # which is the part that was missing.
  #
  # ## What A64-030.2 found here — B-1
  #
  # This loop invoked `create --destination`, and the CLI's flag is
  # `--into`. `--destination` is the name of an internal Python parameter
  # and has never been an argument. Every run therefore died in argparse
  # with exit 2, `|| true` discarded it, and the container slept for a day
  # and did it again — **for ever, on a container reporting `Up`.**
  #
  # No archive was written, so `arena64_backup_last_success_timestamp_seconds`
  # was never published; the alerts that fire on its absence are
  # `BackupNeverSucceeded` and `BackupNeverCopiedOffHost`, and they evaluate
  # in a Prometheus that A64-030.2 also found was not deployed. Two silent
  # failures in series is how a platform arrives at a restore with nothing
  # to restore from.
  #
  # ## Why the loop still survives a failure, and what changed
  #
  # Surviving is right: this is a resident service, the next interval is a
  # real chance to succeed, and a container that exits on a transient
  # `pg_dump` error would restart-loop against a database that is merely
  # busy. What was wrong was `|| true`, which is *silence* rather than
  # survival. The status is captured and reported instead, so a failure is
  # a line in the log with a non-zero code in it — and `create` itself
  # never records success it did not have, so the metrics stay true whether
  # this succeeds or not.
  backup:
    <<: [*api-image, *logging]
    restart: unless-stopped
    environment:
      <<: *api-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 64M
    # The image's own healthcheck curls `/api/v1/health`, which this
    # container does not serve — it is a backup loop, not the API. Left in
    # place it reports `unhealthy` for ever on a container that is working,
    # which is a signal that trains an operator to ignore signals.
    healthcheck:
      disable: true
    volumes:
      - backup_data:/var/backups/arena64
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.operator.backup create --into /var/backups/arena64
          status=$$?
          if [ "$$status" -ne 0 ]; then
            echo "backup: create FAILED with exit $$status — no new archive and no off-host copy. The last-success and last-offsite metrics are unchanged, so BackupStale and BackupNotCopiedOffHost fire on their age. Retrying at the next interval." >&2
          fi
          sleep "${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    depends_on:
      postgres:
        condition: service_healthy

configs:
  # The operator bearer token, delivered to Prometheus as a file because
  # that is the shape `prometheus.yml`'s `credentials_file` asks for. One
  # source — `production.env` — and no second copy to keep in step.
  ops_token:
    content: ${OPS_TOKEN}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  letsencrypt:
  certbot_webroot:
  web_dist:
  admin_dist:
  backup_data:
