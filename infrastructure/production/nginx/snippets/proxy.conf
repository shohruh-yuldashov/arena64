# What every proxied request carries — A64-028.6A §14.
#
# ## `X-Forwarded-For` is **replaced**, never appended
#
# The obvious directive is `$proxy_add_x_forwarded_for`, which appends the
# peer address to whatever the client sent. It is the wrong one here.
#
# `app/api/rate_limiting.py::client_ip` reads the address
# `RATE_LIMIT_TRUSTED_PROXY_COUNT` entries from the **right** of the header,
# because each trusted proxy appends exactly one entry. With a count of 1
# and an appending proxy, the value read is the one nginx wrote — correct,
# and only correct as long as the count and the proxy chain agree.
#
# Replacing removes the dependency on that agreement entirely. The header
# reaching the application has exactly one entry and nginx wrote it, so a
# client sending `X-Forwarded-For: 1.2.3.4` cannot contribute to it under
# any count. It is what the Caddyfile did (`header_up X-Forwarded-For
# {remote_host}`) and it is strictly the safer of the two.
#
# The cost is that a legitimate upstream proxy's chain is lost. Arena64 has
# one hop, stated in the compose file and in `RATE_LIMIT_TRUSTED_PROXY_COUNT`;
# if a CDN is ever put in front, this line and that number change together
# or the limiter starts rate-limiting the CDN as a single client.

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Load-bearing, and measured. A variable `proxy_pass` resolves through the
# `resolver`, which returns every address behind the `api` alias — so there
# **is** a second server in scope and nginx does try it. With one replica's
# application killed and its container still in DNS, 8 of 8 requests were
# answered by the survivor. `nginx.conf` carries the rest of the numbers.
#
# Deliberately **not** `non_idempotent`: retrying a POST that the first
# upstream may already have applied is how a move gets played twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

# PROPOSED PRODUCTION DEFAULT. A64-028.5A measured p99 at 616 ms and a
# maximum of 1.45 s across a 35-minute mixed workload, so 30 s is two orders
# of magnitude of headroom — it is a runaway guard, not a latency target.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
