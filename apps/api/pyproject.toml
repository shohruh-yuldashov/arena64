[project]
name = "arena64-api"
version = "0.1.0"
description = "Arena64 backend — HTTP, WebSocket, and worker profiles under one deployable artifact (architecture.md AD-02)"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    # Password hashing (A64-011.1). The reference Python binding for the
    # Argon2 C library — chosen over a pure-Python implementation because
    # Argon2's security *is* its memory-hardness, and a pure-Python one
    # cannot deliver the memory cost that makes it worth using.
    "argon2-cffi>=25.1,<26.0",
    # JWT (A64-011.3). PyJWT rather than python-jose: it is the reference
    # implementation, it requires `algorithms=` on every decode (making the
    # algorithm-confusion attack awkward to write by accident rather than
    # easy), and python-jose has a history of CVEs in exactly that area.
    "pyjwt>=2.10,<3.0",
    # HTTP client (A64-021.5). Promoted from `dev` to a runtime dependency
    # when Resend became this platform's email transport: `ResendEmailProvider`
    # posts one JSON body to one endpoint, and the alternative — the `resend`
    # SDK — is a synchronous client in an async worker whose entire job is
    # I/O, with no per-request timeout to set.
    #
    # No new vendor arrives with it. The test suite already depends on httpx
    # for FastAPI's ASGI client, so this promotes a package that was being
    # installed and audited anyway rather than adding one (CLAUDE.md §2.6).
    "httpx>=0.27,<1.0",
    # Web Push cryptography (A64-021.6). Web Push is two standards and both
    # are cryptographic: RFC 8292 signs a VAPID assertion with ES256 over
    # P-256, and RFC 8291 encrypts every payload with ECDH + HKDF-SHA256 +
    # AES-128-GCM. There is no version of this feature that does not need
    # these primitives, and none of them may be hand-rolled.
    #
    # `cryptography` rather than `pywebpush`, and it is one package instead
    # of four. `pywebpush` brings `requests`, `http-ece` and `py-vapid` on
    # top of this same library, and its `webpush()` is **synchronous** — in
    # the delivery worker, whose entire job is I/O, that is the objection
    # that ruled out the Resend SDK in A64-021.5, with the same consequence
    # (a blocked event loop, or a thread per message) and the same missing
    # per-request timeout. What it saves is roughly eighty lines of RFC 8291,
    # which is written once and pinned to a standard that does not move.
    #
    # PyJWT above already has an ES256 path and needs exactly this library
    # to take it, so half of what is added here was a latent requirement of
    # a dependency this repository already audited.
    "cryptography>=44.0,<47.0",
    # Image processing (A64-012.2). Pillow is the only mature option in
    # Python and is the one the task names. Used for exactly three things —
    # decoding an *already signature-validated* upload, applying EXIF
    # orientation, and re-encoding to WebP — because those are the
    # operations that cannot be done safely by hand.
    #
    # Kept at a recent floor deliberately: image decoders are a historically
    # rich source of memory-safety CVEs, and this one is fed bytes by
    # anonymous-adjacent callers. `Image.MAX_IMAGE_PIXELS` (see
    # `PillowImageProcessor`) is the decompression-bomb guard on top.
    "pillow>=11.0,<12.0",
    # Multipart parsing (A64-012.2). FastAPI needs it to accept
    # `multipart/form-data`, which is what a file upload is — declared
    # explicitly rather than left as a transitive extra, because without it
    # the avatar routes raise at *import* time and the whole app fails to
    # start. A dependency the process cannot boot without is a direct one.
    "python-multipart>=0.0.20,<0.1",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    # Architecture validation (A64-013.8). The boundaries this codebase is
    # built around — `app/platform` importing no module, a module reachable
    # only through its `public/` package — were prose until this task, and
    # prose does not stop the hundredth pull request. `import-linter` turns
    # each rule into a contract that fails CI, which is the only form of an
    # architecture rule that survives contact with a deadline.
    #
    # A dev dependency, never a runtime one: it reads the import graph and
    # ships in no image.
    "import-linter>=2.0,<3.0",
    "pyright>=1.1,<2.0",
]

# --- Build backend -----------------------------------------------------------
# hatchling: no legacy setup.py, minimal configuration, actively maintained.
# Packaging (rather than relying on CWD imports) is what lets tests import the
# *installed* package — services.md §1 flags a flat/uninstalled layout as the
# way tests accidentally pass against files that were never packaged.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff ----------------------------------------------------------------
# Lint/format tool choice is not yet ratified by an ADR (coding-standards.md
# is a placeholder). Ruff is applied here as the working default — boring,
# single-binary, replaces flake8+isort+black — and should be confirmed or
# replaced by that ADR rather than treated as final.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Pyright -----------------------------------------------------------------
# A second type checker, not a replacement for mypy. They disagree in both
# directions and each catches things the other misses — A64-010 found
# Pyright correctly rejecting a `*args` stand-in for a Protocol method that
# mypy accepted, while mypy correctly accepts pydantic-settings'
# `_env_file` that Pyright cannot see. Running both is what makes those
# disagreements visible instead of arbitrary.
#
# `standard` rather than `strict`: mypy already runs in strict mode over
# the same tree, and a second maximal checker mostly produces duplicate
# findings plus its own false positives on the same pydantic dynamism.
[tool.pyright]
include = ["app", "tests", "main.py", "alembic/env.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# --- Mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# `asyncpg` ships no `py.typed` marker, so strict mode refuses the import
# rather than the library. Scoped to that one package: a blanket
# `ignore_missing_imports` would silence a genuinely missing dependency
# anywhere in the tree. Only `tests/contract/test_schema_drift.py` imports
# it directly — everything else reaches PostgreSQL through SQLAlchemy,
# which is typed.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# --- Pytest ------------------------------------------------------------------
# ENVIRONMENT=test is set in tests/conftest.py before app imports, not here —
# keeps the test environment free of an extra plugin dependency.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0.12.20260815",
]
