[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# No sqlalchemy.url here — env.py reads it from app.config.settings so the
# same layered configuration (dependency-injection.md §2.2) governs
# migrations and the running application. Do not hardcode a DSN in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
