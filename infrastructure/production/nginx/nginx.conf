# The production edge — A64-028.6A.
#
# Replaces `infrastructure/production/Caddyfile`. The behaviour A64-028.6
# established is unchanged and re-proved through nginx; what changed is the
# implementation and, in three places, the mechanism — see
# `docs/01-architecture/deployment.md` §8 for the migration matrix.
#
# ## Three things nginx does not do for you that Caddy did
#
#   TLS          Caddy obtains and renews certificates itself. Nginx does
#                not, so `certbot` is a service in the compose file and
#                this process reloads on a timer to pick up a renewal.
#   headers      `add_header` is not inherited into a location that sets one
#                of its own. Every such location includes the snippet.
#   `Server`     Caddy could remove the header. Nginx can only reduce it to
#                `nginx` without a third-party module; `server_tokens off`
#                is as far as the official image goes, and the version — the
#                part worth hiding — is gone.

user nginx;

# One per core. `auto` reads the cgroup limit inside a container, so a CPU
# quota is respected rather than the host's core count being assumed.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging — A64-028.6A §27 --------------------------------------------
    #
    # The default `combined` format logs `$request`, which is the raw request
    # line **including the query string**. A password reset link is
    # `?token=…`, an email verification is `?code=…`, and both are things
    # `app/common/redaction.py` goes to some length to keep out of the
    # application's own logs. Logging them at the edge would put them back.
    #
    # `$uri` is the normalised path with the query string removed. Nothing
    # here logs a header, so `Authorization` and `Cookie` cannot appear.
    #
    # `$request_id` is nginx's own, not the application's — the application
    # mints its own per request and echoes it as `X-Request-Id`. Both are
    # low-cardinality in a log and neither is ever a metric label.
    log_format arena64 escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","protocol":"$server_protocol",'
        '"request_id":"$request_id","referer":"$http_referer"}';

    access_log /var/log/nginx/access.log arena64;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --- Request limits — §22 ------------------------------------------------
    #
    # PROPOSED PRODUCTION DEFAULT, every one of them. The only body Arena64
    # accepts that is not JSON is an avatar upload, and the application caps
    # that itself; 2 MB is above that cap and far below anything worth
    # buffering to disk. The header and body timeouts exist for a slow-loris
    # client, which is the attack these two numbers are entirely about.
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # --- Compression — §21 ---------------------------------------------------
    #
    # gzip only. Brotli is not in the official nginx image and would need a
    # third-party module and a custom build, which §21 says not to do for it.
    #
    # `gzip_types` names text formats only: an image, a font in `woff2` and
    # a `.gz` are already compressed, and re-compressing them costs CPU to
    # make them fractionally larger.
    #
    # `gzip_proxied` is deliberately absent, which means nginx does not
    # compress a proxied response by default. API responses are per-player
    # and `no-store`, so nothing downstream caches them and the BREACH
    # consideration is moot — but the bytes are small and the CPU is the
    # bottleneck A64-028.5A measured, so not compressing them is the cheaper
    # side of the trade.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # --- The upgrade map — §12 -----------------------------------------------
    #
    # `Connection: upgrade` only when the client asked to upgrade. A static
    # `Connection: upgrade` on every proxied request breaks keepalive to the
    # upstream for ordinary HTTP, which is most of the traffic.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Upstream resolution — §10, §11 --------------------------------------
    #
    # ## Why there is no `upstream` block
    #
    # The obvious form — `upstream arena64_api { server api-1:8000; server
    # api-2:8000; }` — was written first and rejected by evidence. Nginx
    # resolves the names in an `upstream` block **once, at configuration
    # parse time**, and treats a name it cannot resolve as fatal:
    #
    #     nginx: [emerg] host not found in upstream "api-1:8000"
    #
    # That is not a startup-ordering inconvenience. It means an edge that
    # **refuses to start while a backend is down** — one crashed API
    # container takes the entire site offline, including the static pages
    # that need no backend at all — and a `reload` during a rolling deploy
    # that fails for the same reason, leaving the old configuration running
    # and a certificate renewal silently unapplied.
    #
    # It also carries the staleness §10 asks about: an address resolved once
    # is an address kept for ever, so a container that restarts onto a new
    # IP is proxied to a socket nobody is listening on until somebody
    # reloads.
    #
    # ## What replaces it
    #
    # A `resolver` and a variable in `proxy_pass`, which defers resolution to
    # request time. Nginx starts whether or not any backend exists, and
    # re-reads Docker's embedded DNS every ten seconds, so a restarted
    # container is picked up within that window and a stopped one disappears
    # from rotation without a reload.
    #
    # `api` is a **network alias shared by both replicas** (see the compose
    # file), so the name returns every running container and Docker's DNS
    # round-robins between them. Load balancing is therefore Docker's rather
    # than nginx's, which is a real trade and is stated as one:
    #
    #   gained   nginx starts and reloads regardless of backend state;
    #            no stale address; a stopped container leaves rotation by
    #            itself; the replicas keep individual names for draining.
    #   lost     `max_fails`/`fail_timeout`, and with them instant failover.
    #
    # ## What that costs, measured rather than reasoned
    #
    # Twenty requests through the edge in each state, one replica of two:
    #
    #     both replicas up                      20/20 answered
    #     container stopped, probed at once     19/20 answered
    #     after the resolver TTL expired        20/20 answered
    #
    # And with the **application** killed while its container stayed in DNS —
    # a socket that refuses rather than an address that is gone — 8 of 8
    # answered, because `proxy_next_upstream` reaches the second address DNS
    # returned.
    #
    # So the cost of losing `max_fails` is one request in twenty during the
    # few seconds between a container stopping and the resolver noticing.
    # The TTL below bounds it, which is why it is five seconds rather than
    # the thirty a cache would prefer, and it is off the deploy path
    # entirely: a deploy drains an instance and waits before stopping it.
    #
    # The case that remains uncovered is narrower than "unhealthy": a
    # container that **accepts a connection and then hangs**. A retry cannot
    # help — the connection succeeded — and only an active health check
    # would. Its own `HEALTHCHECK` marks it unhealthy and an orchestrator
    # with health-aware discovery would drop it; plain Compose does not.
    # Recorded in `docs/01-architecture/runbooks.md#nginx-upstream`.
    #
    # Round-robin is sufficient and sticky sessions are deliberately absent:
    # Arena64 holds no per-connection server state — a session is a JWT, a
    # game is in PostgreSQL and Redis — so pinning a player to an instance
    # would only guarantee that a deploy disconnects them from the one
    # instance they were pinned to.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
