<!doctype html>
<!--
  `lang="uz"` matches the locale `shared/i18n` falls back to and the one
  the manifest declares. `shared/i18n` overwrites it the moment a player
  chooses another language; this is the value that is correct before any
  script has run, which is the only value assistive technology has for the
  first paint.
-->
<html lang="uz" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page reach under a notch and a home
      indicator, which is what makes `env(safe-area-inset-*)` return
      anything at all. `widgets/pwa` uses it to keep the notice strip off
      the home indicator in standalone mode — A64-020.9 §24.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      A64-026.1 §40.11. `/` is the landing page for anybody without an
      account, so this document's title and description **are** its
      metadata — there is no per-route metadata layer in this application
      and adding half of one here would be a second place for it to live.
      The deeper work is A64-026.3.

      In Uzbek, matching `lang="uz"` above and for the same reason: this is
      the value a crawler and a share preview read, and both of them read
      it before any script has chosen a locale.
    -->
    <title>Arena64 — onlayn shashka: reytingli o'yinlar va turnirlar</title>
    <meta
      name="description"
      content="Rus shashkasi onlayn. Bir necha soniyada raqib toping, reytingli yoki oddiy o'ynang, turnirlarda qatnashing. Bepul, brauzerda."
    />

    <!--
      The share preview. `og:image` is the installed-application icon,
      which is a real asset in this repository — a purpose-built social
      card is A64-026.2's, and pointing at one that does not exist yet
      would be a broken preview rather than an early one.

      No `og:url` and no canonical: neither is knowable at build time,
      because this bundle is served from whatever origin deploys it and
      there is no build-time origin to interpolate. Guessing one is worse
      than omitting it — a wrong canonical tells a crawler to index a page
      that is not there.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arena64" />
    <meta
      property="og:title"
      content="Arena64 — onlayn shashka: reytingli o'yinlar va turnirlar"
    />
    <meta
      property="og:description"
      content="Rus shashkasi onlayn. Bir necha soniyada raqib toping, reytingli yoki oddiy o'ynang, turnirlarda qatnashing."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="uz" />
    <meta name="twitter:card" content="summary" />

    <!--
      A64-020.9 §7. The installable-application metadata.

      **One manifest, linked from the one real document.** Everything about
      the installed identity — name, icons, scope, start URL, shortcuts —
      is in `public/manifest.webmanifest` and is not repeated here, because
      two descriptions of one identity is two descriptions to keep in step
      (CLAUDE.md §3.4). What stays in this file is only what a manifest
      cannot express.

      No host is named anywhere below. Every URL is same-origin and
      relative, so one build works behind `localhost:4173` and behind
      arena64.gg without a rebuild — the deployment contract
      `specs/frontend.md` §11 already states.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Two `theme-color`s, because this application has two themes and the
      browser chrome should not contradict the page it frames. A single
      dark value would put a black status bar above a white page for every
      light-mode player.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />

    <!--
      SVG first: the tab renders the icon at 16px, where a downsampled
      192px PNG loses the piece to the checker. The PNG is the fallback for
      anything that will not take a vector.
    -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />

    <!--
      iOS reads none of the manifest for a home-screen launch: the icon,
      the title and the status bar all come from these three tags, and
      without them a saved Arena64 is a screenshot labelled with the URL.
      `apple-mobile-web-app-capable` is deprecated in favour of
      `mobile-web-app-capable` and still the only one older iOS honours,
      so both are here — A64-020.9 §7, §17.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arena64" />
    <!--
      The theme is applied before the first paint, not in an effect. A
      `useEffect` that reads localStorage runs after React has already
      painted, so every reload of a dark-mode session visibly flashes
      light first. This is the one place a blocking inline script earns
      its cost, and it is why `shared/theme` can be a plain context with
      no hydration dance of its own.

      Kept in sync with `shared/theme/theme-helpers.ts` by the test in
      `src/shared/theme/theme.test.tsx`, which asserts the storage key
      and the class this writes are the ones the provider uses.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* A browser with storage disabled gets the light theme and a
             working app, which is the correct degradation. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
