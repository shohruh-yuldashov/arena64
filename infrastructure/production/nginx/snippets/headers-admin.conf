# Every response on the admin host — A64-028.6A §16, §19.
#
# The console's own CSP is tighter than the product's: no inline script at
# all, because it has no pre-paint theme script, and no `blob:` because it
# renders no canvas.

include /etc/nginx/snippets/headers-common.conf;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Wholesale. Every route on this host is private, so unlike the product
# there is no public subset to exclude.
add_header X-Robots-Tag "noindex, nofollow" always;

add_header Alt-Svc 'h3=":443"; ma=86400' always;
